<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Smile Store</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f9f9f9; padding: 20px; }
        .header { background: #000; color: #fff; padding: 10px; margin-bottom: 30px; }
        .product-card { background: white; width: 300px; margin: 0 auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* تنسيق الصورة */
        .product-img { width: 100%; height: auto; border-radius: 10px; margin-bottom: 15px; }
        
        .price { color: #27ae60; font-size: 22px; font-weight: bold; }
        
        /* زرار الواتساب */
        .whatsapp-btn { 
            display: inline-block; 
            background: #25D366; 
            color: white; 
            text-decoration: none; 
            padding: 10px 20px; 
            border-radius: 5px; 
            margin-top: 10px; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Smile Store 😊</h1>
    </div>

    <div class="product-card">
        <img src="shirt.jpg" alt="صورة المنتج" class="product-img">
        
        <h2>تيشيرت مميز</h2>
        <p class="price">250 جنيه</p>
        
        <a href="https://wa.me/+20 11 41845694" class="whatsapp-btn">
            اطلب عبر واتساب 💬
        </a>
    </div>

</body>
</html>
